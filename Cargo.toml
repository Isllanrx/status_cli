[package]
name = "status_cli"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
description = "Right-aligned status line for Claude Code and Antigravity CLI"
license = "MIT"
repository = "https://github.com/Isllanrx/status_cli"

[dependencies]
crossterm = "0.29.0"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4.4"
toml_edit = "0.25.16"
vt100 = "0.16.2"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
