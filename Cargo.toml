[package]
name = "status_cli"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Right-aligned status line for Claude Code and Antigravity CLI"
license = "MIT"
repository = "https://github.com/Isllanrx/status_cli"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
