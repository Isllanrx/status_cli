name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, bin: status_cli }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, bin: status_cli }
          - { os: macos-15-intel, target: x86_64-apple-darwin, bin: status_cli, macos: "10.12" }
          - { os: macos-latest, target: aarch64-apple-darwin, bin: status_cli, macos: "11.0" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: status_cli.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, bin: status_cli.exe }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: runner.os == 'macOS'
        run: |
          bin=target/${{ matrix.target }}/release/status_cli
          otool -l "$bin" | awk '/LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX/ {found=1} found && /minos|version/ {print; exit}'
          codesign --force --sign - "$bin"
          codesign --verify "$bin"
      - uses: actions/upload-artifact@v4
        with:
          name: status_cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  macos-universal:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: status_cli-*-apple-darwin
      - run: |
          lipo -create -output status_cli status_cli-x86_64-apple-darwin/status_cli status_cli-aarch64-apple-darwin/status_cli
          codesign --force --sign - status_cli
          codesign --verify status_cli
          lipo -archs status_cli
      - uses: actions/upload-artifact@v4
        with:
          name: status_cli-universal-apple-darwin
          path: status_cli

  shells:
    needs: macos-universal
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, artifact: status_cli-x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, artifact: status_cli-aarch64-unknown-linux-musl }
          - { os: macos-latest, artifact: status_cli-universal-apple-darwin }
          - { os: macos-15-intel, artifact: status_cli-universal-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: bin
      - run: chmod +x bin/status_cli && echo "$PWD/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish ksh tcsh dash
      - if: runner.os == 'macOS'
        run: brew install fish nushell >/dev/null
      - run: |
          printf '{"session_id":"ci","model":{"display_name":"Opus 5.5"},"effort":{"level":"high"},"rate_limits":{"five_hour":{"used_percentage":72,"resets_at":%s}},"cost":{"total_duration_ms":60000}}' $(( $(date +%s) + 5400 )) > payload.json
          failed=0
          for sh in sh dash bash zsh ksh tcsh fish; do
            command -v "$sh" >/dev/null || { echo "skip $sh"; continue; }
            out=$(NO_COLOR=1 COLUMNS=150 "$sh" -c 'status_cli < payload.json')
            case "$out" in *"Opus - High"*sessão*tempo*) echo "ok $sh" ;; *) echo "FAIL $sh: $out"; failed=1 ;; esac
          done
          if command -v nu >/dev/null; then
            out=$(NO_COLOR=1 nu -c 'open --raw payload.json | status_cli')
            case "$out" in *"Opus - High"*) echo "ok nu" ;; *) echo "FAIL nu: $out"; failed=1 ;; esac
          fi
          exit $failed

  shells-windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, artifact: status_cli-x86_64-pc-windows-msvc }
          - { os: windows-11-arm, artifact: status_cli-aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: bin
      - shell: pwsh
        run: |
          $env:PATH = "$PWD\bin;$env:PATH"
          $env:COLUMNS = '150'
          $env:NO_COLOR = '1'
          $json = '{"session_id":"ci","model":{"display_name":"Opus 5.5"},"effort":{"level":"high"},"cost":{"total_duration_ms":60000}}'
          [IO.File]::WriteAllText("$PWD\payload.json", $json)
          $runs = [ordered]@{
            'cmd'            = { cmd /c "status_cli < payload.json" }
            'powershell 5.1' = { powershell -NoProfile -Command "Get-Content payload.json -Raw | status_cli" }
            'pwsh 7'         = { pwsh -NoProfile -Command "Get-Content payload.json -Raw | status_cli" }
            'git bash'       = { & "$env:ProgramFiles\Git\bin\bash.exe" -c "status_cli < payload.json" }
          }
          $failed = $false
          foreach ($name in $runs.Keys) {
            $out = (& $runs[$name]) -join ''
            if ($out -match 'Opus - High' -and $out -match 'tempo') { "ok $name" } else { "FAIL ${name}: $out"; $failed = $true }
          }
          if ($failed) { exit 1 }

  distros:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:20.04
          - ubuntu:24.04
          - debian:11
          - debian:12
          - archlinux:latest
          - fedora:latest
          - alpine:latest
          - opensuse/tumbleweed:latest
          - rockylinux:9
          - amazonlinux:2023
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: status_cli-x86_64-unknown-linux-musl
          path: bin
      - run: |
          chmod +x bin/status_cli
          printf '{"session_id":"ci","model":{"display_name":"Opus 5.5"},"effort":{"level":"high"},"cost":{"total_duration_ms":60000}}' > bin/payload.json
          out=$(docker run --rm -e COLUMNS=150 -e NO_COLOR=1 -v "$PWD/bin:/v:ro" "${{ matrix.image }}" sh -c '/v/status_cli < /v/payload.json')
          echo "$out"
          case "$out" in *"Opus - High"*tempo*) ;; *) exit 1 ;; esac

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          publish=false
          if [ "$GITHUB_REF" = "refs/heads/main" ] && ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            publish=true
          elif [ "$GITHUB_REF" = "refs/tags/$tag" ]; then
            publish=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "$tag publish=$publish"

  release:
    if: needs.version.outputs.publish == 'true'
    needs: [version, shells, shells-windows, distros]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - run: |
          cd dist
          for dir in */; do
            name="${dir%/}"
            file=$(ls "$dir")
            ext="${file##*.}"; [ "$ext" = "$file" ] && ext="" || ext=".$ext"
            mv "$dir$file" "$name$ext.staged"
            rmdir "$dir"
            mv "$name$ext.staged" "$name$ext"
          done
          sha256sum * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "status_cli $TAG" --generate-notes

  installers:
    needs: [version, release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      STATUS_CLI_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os != 'Windows'
        run: |
          export HOME="$RUNNER_TEMP/home with space" && mkdir -p "$HOME/.claude"
          sh install.sh
          "$HOME/.local/bin/status_cli" --version | grep -q "${TAG#v}"
          "$HOME/.local/bin/codex-stt" --once | grep -q "status_cli:"
          command=$(python3 -c 'import json, os; print(json.load(open(os.path.expanduser("~/.claude/settings.json")))["statusLine"]["command"])')
          echo "configured command: $command"
          printf '{"session_id":"ci","model":{"display_name":"Opus 5.5"},"cost":{"total_duration_ms":60000}}' > payload.json
          failed=0
          for sh in sh bash zsh; do
            command -v "$sh" >/dev/null || { echo "skip $sh"; continue; }
            out=$(env PATH=/usr/bin:/bin NO_COLOR=1 "$sh" -c "$command" < payload.json)
            case "$out" in *Opus*tempo*) echo "ok $sh" ;; *) echo "FAIL $sh: $out"; failed=1 ;; esac
          done
          exit $failed
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'home'
          $env:HOME = $env:USERPROFILE
          New-Item -ItemType Directory -Force (Join-Path $env:USERPROFILE '.claude') | Out-Null
          $env:STATUS_CLI_INSTALL_DIR = Join-Path $env:USERPROFILE '.local\bin'
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $version = & (Join-Path $env:STATUS_CLI_INSTALL_DIR 'status_cli.exe') --version
          if ($version -notmatch [regex]::Escape($env:TAG.TrimStart('v'))) { exit 1 }
          $shortcut = & (Join-Path $env:STATUS_CLI_INSTALL_DIR 'codex-stt.exe') --once
          if ($shortcut -notmatch 'status_cli:') { exit 1 }
          if (-not (Select-String -Path (Join-Path $env:USERPROFILE '.claude\settings.json') -Pattern '"command": "status_cli"' -Quiet)) { exit 1 }
