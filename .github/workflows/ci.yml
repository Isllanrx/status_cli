name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, bin: status_cli }
          - { os: macos-latest, target: aarch64-apple-darwin, bin: status_cli }
          - { os: macos-latest, target: x86_64-apple-darwin, bin: status_cli }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: status_cli.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: status_cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - run: |
          cd dist
          for dir in */; do
            name="${dir%/}"
            file=$(ls "$dir")
            ext="${file##*.}"; [ "$ext" = "$file" ] && ext="" || ext=".$ext"
            mv "$dir$file" "$name$ext"
            rmdir "$dir"
          done
          sha256sum * > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
